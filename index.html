<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voice to Text</title>
</head>
<body>
    <h1>🎙️ 음성 인식 테스트</h1>
    <p>아래 버튼을 누르고 말하세요. 인식된 텍스트는 텍스트 상자에 나타납니다.</p>
    <button id="startButton">인식 시작</button>
    <button id="stopButton" disabled>인식 중지</button>
    <br><br>
    
    <textarea id="output" rows="10" cols="50" placeholder="여기에 말한 내용이 나타납니다..."></textarea>
</body>
</html>
