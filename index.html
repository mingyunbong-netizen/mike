<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>음성 인식 테스트</title>
</head>
<body>
    <h1>🎙️ 음성 인식 (Voice to Text)</h1>
    <p>아래 **'인식 시작'** 버튼을 누른 후, 마이크 사용 권한을 **'허용'**하고 말씀하세요.</p>
    
    <button id="startButton">인식 시작</button>
    <button id="stopButton" disabled>인식 중지</button>
    <br><br>
    
    <textarea id="output" rows="10" cols="50" placeholder="여기에 말한 내용이 나타납니다..."></textarea>
</body>
</html>
